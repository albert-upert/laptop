<!DOCTYPE html>
<html>
<head>
    <title>Form Serah Terima Laptop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Form Pengajuan Laptop Baru</h2>
    <form action="/submit_karyawan" method="post" class="card p-4">
        <div class="mb-3">
            <label>Nama Lengkap:</label>
            <input type="text" name="nama" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>NIP:</label>
            <input type="text" name="nip" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Model Laptop Lama:</label>
            <input type="text" name="model_lama" class="form-control" placeholder="Contoh: Dell Latitude E7440" required>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" required>
            <label class="form-check-label">Saya setuju laptop lama menjadi hak milik saya dan tanggung jawab pribadi.</label>
        </div>
        <button type="submit" class="btn btn-primary">Kirim Data</button>
    </form>
</body>
</html>
