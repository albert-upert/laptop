<!DOCTYPE html>
<html>
<head>
    <title>Admin TIK - Verifikasi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Antrean Verifikasi Laptop</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nama (NIP)</th>
                <th>Model Lama</th>
                <th>Input SN Lama & Baru</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            {% for row in transactions %}
            <tr>
                <form action="/approve/{{ row[0] }}" method="post">
                    <td>{{ row[1] }} ({{ row[2] }})</td>
                    <td>{{ row[3] }}</td>
                    <td>
                        <input type="text" name="sn_lama" placeholder="SN Lama" required class="mb-1">
                        <input type="text" name="sn_baru" placeholder="SN Baru" required>
                    </td>
                    <td><button type="submit" class="btn btn-success btn-sm">Approve & Selesai</button></td>
                </form>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
